# RC por digest: el workflow descarga imágenes y nunca compila en el servidor.
# Configuración y credenciales propias; no lee las variables de producción.
name: paraglide-staging

services:
  db:
    image: postgres:18.4-alpine
    container_name: parapente_postgres_staging
    environment:
      POSTGRES_USER: staging
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?Falta credencial propia de staging}
      POSTGRES_DB: parapente_staging_db
    command: >-
      -c shared_preload_libraries=pg_stat_statements
      -c shared_buffers=128MB
      -c max_connections=100
    ports:
      - '127.0.0.1:5680:5432'
    volumes:
      - postgres_staging_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U staging -d parapente_staging_db']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [staging_net]

  api:
    image: ${RC_API_IMAGE:?Seleccionar el digest API de una RC}
    container_name: parapente_api_staging
    environment:
      DATABASE_URL: postgresql://staging:${STAGING_DB_PASSWORD:?Falta credencial propia de staging}@db:5432/parapente_staging_db?connection_limit=10
      JWT_SECRET: ${STAGING_JWT_SECRET:?Falta JWT propio de staging}
      STAGING_ADMIN_EMAIL: ${STAGING_ADMIN_EMAIL:?Falta usuario de staging}
      STAGING_ADMIN_PASSWORD: ${STAGING_ADMIN_PASSWORD:?Falta clave de staging}
      PORT: 3001
      NODE_ENV: production
      PUBLIC_WEB_URL: http://localhost:3200
      ALLOWED_ORIGINS: http://localhost:3200,http://127.0.0.1:3200
      NO_PROXY: localhost,127.0.0.1,api,db
      no_proxy: localhost,127.0.0.1,api,db
    ports:
      - '127.0.0.1:3201:3001'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/public/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks: [staging_net]

  web:
    image: ${RC_WEB_IMAGE:?Seleccionar el digest Web de una RC}
    container_name: parapente_web_staging
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api
      INTERNAL_API_URL: http://api:3001
      NO_PROXY: localhost,127.0.0.1,api,db
      no_proxy: localhost,127.0.0.1,api,db
    ports:
      - '127.0.0.1:3200:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks: [staging_net]

volumes:
  postgres_staging_data:
    # Volumen nuevo: no adopta ni resetea un staging anterior con otras credenciales.
    name: paraglide_rc_staging_data

networks:
  staging_net:
    name: paraglide-staging-net
    driver: bridge
