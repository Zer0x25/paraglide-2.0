services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:18.4-alpine}
    container_name: parapente_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      POSTGRES_DB: ${POSTGRES_DB:-parapente_db}
    # Pilar 4.5: tuning conservador para homelab — la API usa el pool de Prisma
    # (connection_limit=10); autovacuum más agresivo para tablas con soft-delete
    # Pilar 4.6: pg_stat_statements para medir queries reales
    command: >
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.max=10000
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=100
      -c autovacuum_vacuum_scale_factor=0.05
      -c autovacuum_analyze_scale_factor=0.05
      -c autovacuum_vacuum_cost_limit=2000
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5678}:5432"
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - paraglide_internal

  api:
    # Imagen construida en GitHub Actions y publicada en GHCR (ver deploy.yml).
    # El servidor solo hace `docker compose pull`; ya no compila localmente.
    image: ${API_IMAGE:-ghcr.io/zer0x25/paraglide-2.0-api:latest}
    container_name: parapente_api
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://admin:adminpassword@db:5432/parapente_db?connection_limit=10}
      PORT: ${API_CONTAINER_PORT:-3001}
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en el .env (sin valores por defecto)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_CALENDAR_CLIENT_EMAIL: ${GOOGLE_CALENDAR_CLIENT_EMAIL:-}
      GOOGLE_CALENDAR_PRIVATE_KEY: ${GOOGLE_CALENDAR_PRIVATE_KEY:-}
      CENTRO_LAT: ${CENTRO_LAT:--20.27}
      CENTRO_LON: ${CENTRO_LON:--70.13}
      NODE_ENV: ${DOCKER_NODE_ENV:-production}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3100}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      GIT_COMMIT_SHA: ${IMAGE_TAG:-${GIT_COMMIT_SHA:-unknown}}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3101}:${API_CONTAINER_PORT:-3001}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${API_CONTAINER_PORT:-3001}/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    networks:
      - proxy_net
      - paraglide_internal

  web:
    # Imagen construida en GitHub Actions y publicada en GHCR (ver deploy.yml).
    image: ${WEB_IMAGE:-ghcr.io/zer0x25/paraglide-2.0-web:latest}
    container_name: parapente_web
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3100}:${WEB_CONTAINER_PORT:-3000}"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      INTERNAL_API_URL: ${DOCKER_INTERNAL_API_URL:-http://api:3001}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PORT: ${WEB_CONTAINER_PORT:-3000}
      NODE_ENV: ${DOCKER_NODE_ENV:-production}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - proxy_net

volumes:
  postgres_data_v18:

networks:
  proxy_net:
    external: true
  paraglide_internal:
    driver: bridge
