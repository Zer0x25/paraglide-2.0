name: CI (Integración Continua)

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
    paths-ignore:
      - 'docs/**'
      - 'memories/**'
      - '**/*.md'
      - '.agents/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'memories/**'
      - '**/*.md'
      - '.agents/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'

jobs:
  detect-changes:
    name: Detectar Módulos Afectados
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (!startsWith(github.event.head_commit.message, 'Merge pull request #') &&
       !contains(github.event.head_commit.message, 'chore(main): release') &&
       !contains(github.event.head_commit.message, 'release-please--branches'))
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      mcp: ${{ steps.filter.outputs.mcp }}
      any_code: ${{ steps.filter.outputs.any_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Evaluar Rutas Modificadas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
            mcp:
              - 'apps/mcp/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
            any_code:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'

  typecheck-and-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.any_code == 'true' }}
    env:
      WEB_CHANGED: ${{ needs.detect-changes.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline --loglevel=error

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Build shared (tipos @parapente/shared)
        run: npm run build:shared

      - name: TypeScript Monorepo Typecheck
        run: npm run typecheck

      - name: ESLint (Web)
        if: ${{ github.event_name == 'workflow_dispatch' || env.WEB_CHANGED == 'true' }}
        run: npm run lint 2>&1 | tee /tmp/eslint.log; exit ${PIPESTATUS[0]}

      - name: Upload lint logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-web-logs
          path: /tmp/eslint.log
          retention-days: 7

  test-api:
    name: Tests API (Vitest)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.api == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline --loglevel=error

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Build shared + Run API tests
        run: |
          npm run build:shared
          npm run test:api

  test-web:
    name: Tests Web (Vitest ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.web == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline --loglevel=error

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Build shared + Run web tests
        run: |
          npm run build:shared
          npm --prefix apps/web test -- --shard=${{ matrix.shard }}

  test-mcp:
    name: Tests MCP Server (Vitest)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.mcp == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline --loglevel=error

      - name: Build shared + Run MCP tests
        run: |
          npm run build:shared
          npm run test:mcp

  ci-gate:
    name: CI Quality Gate ✅
    runs-on: ubuntu-latest
    needs: [detect-changes, typecheck-and-lint, test-api, test-web, test-mcp]
    if: always()
    steps:
      - name: Evaluar Estado de Módulos
        env:
          RES_DETECT: ${{ needs.detect-changes.result }}
          RES_TYPECHECK: ${{ needs.typecheck-and-lint.result }}
          RES_API: ${{ needs.test-api.result }}
          RES_WEB: ${{ needs.test-web.result }}
          RES_MCP: ${{ needs.test-mcp.result }}
        run: |
          if [ "$RES_DETECT" = "skipped" ]; then
            echo "⏭️ Merge de PR o release detectado: el CI ya fue validado en el Pull Request. Omitiendo re-ejecución redundante en main."
            exit 0
          fi
          RESULTS="$RES_TYPECHECK $RES_API $RES_WEB $RES_MCP"
          if echo "$RESULTS" | grep -q 'failure'; then
            echo "❌ Falló al menos una de las suites de prueba ejecutadas."
            exit 1
          fi
          echo "🎉 CI Quality Gate aprobado: todos los módulos afectados pasaron sus pruebas y validaciones con éxito."
