name: CI (Integración Continua)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      full:
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'

jobs:
  validate:
    # Mantener este nombre estable: es el check obligatorio de main.
    name: CI Quality Gate ✅
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Detectar módulos afectados
        if: github.event_name == 'pull_request' && !inputs.full
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infrastructure:
              - 'packages/**/!(*.md)'
              - 'package*.json'
              - 'tsconfig*.json'
              - '.npmrc'
              - '.dockerignore'
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/actionlint.yaml'
              - 'scripts/**/!(*.md)'
              - 'docker-compose*.yml'
              - '**/Dockerfile'
            api:
              - 'apps/api/**/!(*.md)'
            web:
              - 'apps/web/**/!(*.md)'
            mcp:
              - 'apps/mcp/**/!(*.md)'

      - name: Seleccionar validaciones
        id: scope
        env:
          FULL: ${{ inputs.full || github.event_name != 'pull_request' }}
          INFRASTRUCTURE: ${{ steps.changes.outputs.infrastructure }}
          API: ${{ steps.changes.outputs.api }}
          WEB: ${{ steps.changes.outputs.web }}
          MCP: ${{ steps.changes.outputs.mcp }}
        run: node scripts/ci/candidate.mjs scope

      - name: Setup Node.js
        if: steps.scope.outputs.any == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias una vez
        if: steps.scope.outputs.any == 'true'
        run: npm ci --no-audit --prefer-offline --loglevel=error

      - name: Validar contratos del pipeline RC
        if: steps.scope.outputs.any == 'true'
        run: npm run test:ci

      - name: Generar cliente Prisma
        if: steps.scope.outputs.any == 'true'
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Compilar shared y verificar tipos
        if: steps.scope.outputs.any == 'true'
        run: npm run build:shared && npm run typecheck

      - name: Lint Web
        if: steps.scope.outputs.web == 'true'
        run: npm run lint

      - name: Tests API
        if: steps.scope.outputs.api == 'true'
        run: npm run test:api

      - name: Tests Web
        if: steps.scope.outputs.web == 'true'
        run: npm run test:web

      - name: Tests MCP
        if: steps.scope.outputs.mcp == 'true'
        run: npm run test:mcp

      - name: Resultado
        env:
          ANY_CODE: ${{ steps.scope.outputs.any }}
        run: |
          if [ "$ANY_CODE" = "true" ]; then
            echo "Validaciones de los módulos afectados aprobadas." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Cambios de documentación: no requieren instalar dependencias ni ejecutar suites." >> "$GITHUB_STEP_SUMMARY"
          fi
