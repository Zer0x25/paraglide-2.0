name: RC → Staging

on:
  workflow_call:
    inputs:
      rc_tag:
        description: Tag de una prerelease RC publicada
        required: true
        type: string
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'RC publicada que se quiere desplegar o reintentar (vX.Y.Z-rc.N)'
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  pull-requests: read

# Serializa toda la RC para que sus pruebas no coincidan con otro despliegue.
concurrency:
  group: rc-staging
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'

jobs:
  resolve:
    name: Verificar origen de la RC
    if: github.event_name != 'release' || github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.rc.outputs.tag }}
      commit: ${{ steps.rc.outputs.commit }}
      image_base: ${{ steps.rc.outputs.image_base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verificar prerelease, tag, versión y pertenencia a main
        id: rc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC_TAG: ${{ inputs.rc_tag || github.event.release.tag_name }}
        run: node scripts/ci/candidate.mjs resolve

  validate:
    name: Validación completa de la candidata
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      full: true

  images:
    name: Construir una vez y registrar imágenes
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RC_TAG: ${{ needs.resolve.outputs.tag }}
      RC_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Preparar ruta del manifiesto
        run: echo "RC_MANIFEST=$RUNNER_TEMP/rc-manifest.json" >> "$GITHUB_ENV"
      - name: Comprobar si la candidata ya tiene imágenes registradas
        id: existing
        run: |
          EXISTS=$(gh release view "$RC_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | index("rc-manifest.json") != null')
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          if [ "$EXISTS" = "true" ]; then
            gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --pattern rc-manifest.json --dir "$RUNNER_TEMP"
            node scripts/ci/candidate.mjs verify
          fi
      - name: Configurar Buildx nativo amd64
        if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        if: steps.existing.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir API
        if: steps.existing.outputs.exists != 'true'
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ needs.resolve.outputs.image_base }}-api:${{ needs.resolve.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.commit }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: GIT_COMMIT_SHA=${{ needs.resolve.outputs.commit }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Construir Web
        if: steps.existing.outputs.exists != 'true'
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ needs.resolve.outputs.image_base }}-web:${{ needs.resolve.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.commit }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            INTERNAL_API_URL=http://api:3001
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Registrar manifiesto inmutable en la prerelease
        if: steps.existing.outputs.exists != 'true'
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          node scripts/ci/candidate.mjs create
          gh release upload "$RC_TAG" "$RC_MANIFEST" --repo "$GITHUB_REPOSITORY"

  staging:
    name: Desplegar y probar staging
    needs: [resolve, images]
    runs-on: [self-hosted, srv-hp-vm]
    timeout-minutes: 40
    environment:
      name: staging
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RC_TAG: ${{ needs.resolve.outputs.tag }}
      RC_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Preparar rutas de evidencia
        run: |
          echo "RC_MANIFEST=$RUNNER_TEMP/rc-manifest.json" >> "$GITHUB_ENV"
          echo "RC_VERIFICATION=$RUNNER_TEMP/staging-verification.json" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Descargar y verificar el manifiesto
        run: |
          gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --pattern rc-manifest.json --dir "$RUNNER_TEMP" --clobber
          node scripts/ci/candidate.mjs verify
      - name: Preparar herramientas de pruebas
        run: |
          npm ci --no-audit --prefer-offline --loglevel=error
          npx playwright install chromium
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preparar esquema y arrancar la RC por digest
        run: node scripts/ci/staging.mjs deploy
      - name: Integración HTTP y E2E contra staging
        run: node scripts/ci/staging.mjs test 2>&1 | tee "$RUNNER_TEMP/staging-tests.log"
      - name: Guardar evidencia de aprobación técnica
        run: |
          node scripts/ci/candidate.mjs verified
          gh release upload "$RC_TAG" "$RC_VERIFICATION" --repo "$GITHUB_REPOSITORY" --clobber
          echo "RC $RC_TAG validada en staging. Stable requiere una promoción posterior de estas mismas imágenes." >> "$GITHUB_STEP_SUMMARY"
          cat "$RC_MANIFEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnóstico si falla staging
        if: failure()
        run: node scripts/ci/staging.mjs logs
      - name: Conservar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-results-${{ needs.resolve.outputs.tag }}
          path: |
            ${{ runner.temp }}/staging-tests.log
            test-results/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
