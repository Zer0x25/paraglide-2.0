name: Deploy to Homelab

on:
  workflow_call:
    inputs:
      build_images:
        description: 'Construir y subir imágenes Docker a GHCR'
        required: false
        type: boolean
        default: true
      deploy_to_vm:
        description: 'Desplegar en VM de Homelab (self-hosted runner)'
        required: false
        type: boolean
        default: true
      platforms:
        description: 'Plataformas Docker'
        required: false
        type: string
        default: 'linux/amd64'
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths-ignore:
      - 'docs/**'
      - 'memories/**'
      - '**/*.md'
      - '.agents/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      build_images:
        description: 'Construir y subir imágenes Docker a GHCR'
        required: true
        type: boolean
        default: true
      deploy_to_vm:
        description: 'Desplegar en VM de Homelab (self-hosted runner)'
        required: true
        type: boolean
        default: true
      platforms:
        description: 'Plataformas Docker (linux/amd64 para lab rápido, linux/amd64,linux/arm64 para prod)'
        required: true
        default: 'linux/amd64'
        type: choice
        options:
          - 'linux/amd64'
          - 'linux/amd64,linux/arm64'
          - 'linux/arm64'

# Evita que dos pushes corran el deploy en paralelo sobre el mismo runner
# self-hosted (comparten contenedores/imágenes y se pisan entre sí).
concurrency:
  group: deploy-homelab
  cancel-in-progress: false

# packages:write permite publicar las imágenes en GHCR desde CI;
# contents:read es lo único que necesita el checkout.
permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'
  BUILD_PLATFORMS: ${{ inputs.platforms || (startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64') }}

jobs:
  plan:
    name: Determinar Acciones (Build / Deploy)
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: Evaluar Flags de Ejecución
        id: decide
        run: |
          # Si fue invocado via workflow_call (ej: release-please) o workflow_dispatch, inputs tiene valor
          if [ -n "${{ inputs.build_images }}" ]; then
            SHOULD_BUILD="${{ inputs.build_images }}"
            SHOULD_DEPLOY="${{ inputs.deploy_to_vm }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            # Releases formales compilan y despliegan siempre
            SHOULD_BUILD="true"
            SHOULD_DEPLOY="true"
          else
            # Push a main sin inputs: solo compila/despliega si el commit incluye la etiqueta [deploy] o [build-image]
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            if echo "$COMMIT_MSG" | grep -iqE '\[deploy\]|\[build-image\]'; then
              SHOULD_BUILD="true"
            else
              SHOULD_BUILD="false"
            fi
            if echo "$COMMIT_MSG" | grep -iq '\[deploy\]'; then
              SHOULD_DEPLOY="true"
            else
              SHOULD_DEPLOY="false"
            fi
          fi
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "should_deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT
          echo "### 📋 Plan de Ejecución (CD)" >> $GITHUB_STEP_SUMMARY
          echo "| Acción | Ejecutar | Causa / Origen |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Construir Imágenes Docker | **$SHOULD_BUILD** | Evento: \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Desplegar a la VM | **$SHOULD_DEPLOY** | Ref: \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY

  build-api-image:
    name: Build & Push API Image (GHCR)
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.should_build == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<corto> (inmutable, permite rollback) + latest (puntero móvil).
      # El job `deploy` usa `sha-${GITHUB_SHA:0:7}` para tirar de la imagen exacta.
      - name: Docker metadata (api)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zer0x25/paraglide-2.0-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-web-image:
    name: Build & Push Web Image (GHCR)
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.should_build == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zer0x25/paraglide-2.0-web
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          # En producción Next reescribe /api/* al API interno del compose.
          build-args: |
            INTERNAL_API_URL=http://api:3001
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to VM (Self-Hosted)
    runs-on: [self-hosted, srv-hp-vm]
    needs: [plan, build-api-image, build-web-image]
    if: always() && needs.plan.outputs.should_deploy == 'true' && (needs.build-api-image.result == 'success' || needs.build-api-image.result == 'skipped') && (needs.build-web-image.result == 'success' || needs.build-web-image.result == 'skipped')
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images & restart (no build)
        # El servidor ya NO compila: solo baja las imágenes inmutables que CI
        # acaba de publicar (tag sha-<corto>) y recrea los contenedores.
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          TARGET_DIR="/home/zer0x/server.lab/repos/paraglide-2.0"
          [ ! -d "$TARGET_DIR" ] && TARGET_DIR="/home/zer0x/server.lab/repos/paraglide"
          cd "$TARGET_DIR"
          git fetch origin main
          git reset --hard origin/main
          export IMAGE_TAG="sha-${GITHUB_SHA:0:7}"
          export API_IMAGE="ghcr.io/zer0x25/paraglide-2.0-api:${IMAGE_TAG}"
          export WEB_IMAGE="ghcr.io/zer0x25/paraglide-2.0-web:${IMAGE_TAG}"
          export GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}"
          export NEXT_PUBLIC_GOOGLE_CLIENT_ID="${NEXT_PUBLIC_GOOGLE_CLIENT_ID}"
          # Persistir para futuros `docker compose up` manuales sin pasar por Actions
          grep -q "^GOOGLE_CLIENT_ID=" .env 2>/dev/null && sed -i "s/^GOOGLE_CLIENT_ID=.*/GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}/" .env || echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" >> .env
          grep -q "^NEXT_PUBLIC_GOOGLE_CLIENT_ID=" .env 2>/dev/null && sed -i "s/^NEXT_PUBLIC_GOOGLE_CLIENT_ID=.*/NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}/" .env || echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}" >> .env
          docker compose down --remove-orphans || true
          docker compose pull api web
          docker compose up -d --no-build --force-recreate --remove-orphans
          docker image prune -af --filter "until=2h"

      - name: Apply database schema (prisma db push)
        run: |
          TARGET_DIR="/home/zer0x/server.lab/repos/paraglide-2.0"
          [ ! -d "$TARGET_DIR" ] && TARGET_DIR="/home/zer0x/server.lab/repos/paraglide"
          cd "$TARGET_DIR"
          echo "🔄 Aplicando prisma db push contra la BD de produccion..."
          docker compose exec -T api sh -c "npx prisma db push --schema=apps/api/prisma/schema.prisma --skip-generate" || {
            echo "❌ db push falló. Revisa el drift del esquema antes de continuar (un cambio destructivo requiere revisión manual; ver ADR 015)."
            exit 1
          }
          echo "✅ Esquema de BD sincronizado."

      - name: Seed prod defaults (reglas/tarifas/promoción, idempotente)
        run: |
          TARGET_DIR="/home/zer0x/server.lab/repos/paraglide-2.0"
          [ ! -d "$TARGET_DIR" ] && TARGET_DIR="/home/zer0x/server.lab/repos/paraglide"
          cd "$TARGET_DIR"
          echo "🌱 Sembrando defaults de producción (si faltan)..."
          docker compose exec -T api sh -c "npx tsx apps/api/prisma/seed.prod.ts" || {
            echo "⚠️ seed prod no aplicado (se puede re-ejecutar manualmente)."
          }

      - name: Apply special indexes (BRIN, pg_trgm, partials)
        run: |
          TARGET_DIR="/home/zer0x/server.lab/repos/paraglide-2.0"
          [ ! -d "$TARGET_DIR" ] && TARGET_DIR="/home/zer0x/server.lab/repos/paraglide"
          cd "$TARGET_DIR"
          docker compose exec -T api sh -c "npx tsx apps/api/scripts/indexes-especiales.ts" || {
            echo "⚠️ Índices especiales no aplicados (se puede re-ejecutar el script)."
          }

      - name: Post-Deploy Health Check & Auto-Verification
        run: |
          echo "🩺 Esperando readiness de los servicios (hasta 90s)..."
          for i in $(seq 1 30); do
            WEB_OK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100/login 2>/dev/null || echo "000")
            API_OK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3101/api/public/health 2>/dev/null || echo "000")
            if [ "$WEB_OK" = "200" ] && [ "$API_OK" = "200" ]; then
              echo "🟢 Web HTTP $WEB_OK + API HTTP $API_OK listos."
              break
            fi
            echo "⏳ Esperando servicios... (web=$WEB_OK api=$API_OK) [intento $i/30]"
            sleep 3
          done

          for CONTAINER in parapente_web parapente_api parapente_postgres; do
            STATUS=$(docker inspect --format '{{.State.Status}}' "$CONTAINER" 2>/dev/null || echo "not_found")
            if [ "$STATUS" != "running" ]; then
              echo "❌ Error: Container $CONTAINER is not running (Status: $STATUS)"
              docker logs --tail 40 "$CONTAINER" 2>/dev/null || true
              exit 1
            fi
            echo "🟢 Container $CONTAINER is running."
          done

          WEB_OK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100/login 2>/dev/null || echo "000")
          API_OK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3101/api/public/health 2>/dev/null || echo "000")
          if [ "$WEB_OK" != "200" ] || [ "$API_OK" != "200" ]; then
            echo "❌ Health check final falló: web=$WEB_OK api=$API_OK"
            docker logs --tail 40 parapente_api 2>/dev/null || true
            exit 1
          fi

          echo "🎉 All health checks PASSED successfully!"

      - name: Generate Deployment Step Summary
        if: always()
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          HEALTH_JSON=$(curl -s http://localhost:3101/api/public/health 2>/dev/null || echo '{"status":"unreachable"}')
          echo "## 🚀 Despliegue en Homelab" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parámetro | Detalle |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **🌐 URL Producción** | [https://parapente.zer0x.org](https://parapente.zer0x.org) |" >> $GITHUB_STEP_SUMMARY
          echo "| **📦 Commit** | \`$SHORT_SHA\` (\`${{ github.ref_name }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **🐳 Imagen API** | \`ghcr.io/zer0x25/paraglide-2.0-api:sha-$SHORT_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **🐳 Imagen Web** | \`ghcr.io/zer0x25/paraglide-2.0-web:sha-$SHORT_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **📡 API Health** | \`$HEALTH_JSON\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **⏱️ Fecha** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup old Docker images (keep <= 2h)
        if: always()
        run: |
          echo "🧹 Limpiando imágenes antiguas (> 2h) sin contenedor activo..."
          docker image prune -af --filter "until=2h"

  cleanup-ghcr:
    name: Prune Old GHCR Images
    runs-on: ubuntu-latest
    needs: [build-api-image, build-web-image]
    if: success()
    permissions:
      packages: write
    steps:
      - name: Prune old GHCR images (API & Web)
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: 'paraglide-2.0-api,paraglide-2.0-web'
          keep-n-tagged: 3
          exclude-tags: 'latest'
          delete-untagged: true
          delete-partial-images: true
          token: ${{ secrets.GITHUB_TOKEN }}
