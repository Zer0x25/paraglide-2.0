name: RC → Staging
run-name: "${{ github.event_name == 'workflow_dispatch' && 'Reintento manual de RC' || 'Publicar RC' }} ${{ inputs.rc_tag || github.event.release.tag_name }}"

on:
  workflow_call:
    inputs:
      rc_tag:
        description: Tag de una prerelease RC publicada
        required: true
        type: string
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'RC publicada a reintentar (vX.Y.Z-rc.N); despliega ese tag, no el código de la rama seleccionada'
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  pull-requests: read
  actions: read

# Serializa toda la RC para que sus pruebas no coincidan con otro despliegue.
concurrency:
  group: rc-staging
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'

jobs:
  resolve:
    name: Verificar origen de la RC
    if: github.event_name != 'release' || github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.rc.outputs.tag }}
      commit: ${{ steps.rc.outputs.commit }}
      image_base: ${{ steps.rc.outputs.image_base }}
      manifest_exists: ${{ steps.manifest.outputs.present }}
      ci_reused: ${{ steps.evidence.outputs.reused }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verificar prerelease, tag, versión y pertenencia a main
        id: rc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC_TAG: ${{ inputs.rc_tag || github.event.release.tag_name }}
        run: node scripts/ci/candidate.mjs resolve
      - name: Identificar el código que se desplegará
        env:
          RC_TAG: ${{ steps.rc.outputs.tag }}
          RC_COMMIT: ${{ steps.rc.outputs.commit }}
          TRIGGER: ${{ github.event_name }}
        run: |
          {
            echo "Candidata: $RC_TAG"
            echo "Commit de aplicación: $RC_COMMIT"
            echo "Evento: $TRIGGER"
            echo 'Las imágenes y los tests corresponden a esta RC. La rama seleccionada aporta la definición del workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verificar manifiesto previo para reintentar sin repetir CI
        id: manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC_TAG: ${{ steps.rc.outputs.tag }}
          RC_COMMIT: ${{ steps.rc.outputs.commit }}
          RC_MANIFEST: ${{ runner.temp }}/rc-manifest.json
        run: |
          exists=$(gh release view "$RC_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | index("rc-manifest.json") != null')
          if [ "$exists" = "true" ]; then
            gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --pattern rc-manifest.json --dir "$RUNNER_TEMP" --clobber
            node scripts/ci/candidate.mjs verify
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar CI previo del contenido de la candidata
        if: steps.manifest.outputs.present != 'true'
        id: evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_REF: ${{ steps.rc.outputs.commit }}
        run: node scripts/ci/evidence.mjs lookup

  validate:
    name: Validación completa de la candidata
    if: needs.resolve.outputs.manifest_exists != 'true' && needs.resolve.outputs.ci_reused != 'true'
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      full: true

  images:
    name: Construir ${{ matrix.service }}
    needs: [resolve, validate]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.manifest_exists != 'true' && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Una imagen fallida no cancela la otra, pero impide publicar el manifiesto.
      fail-fast: false
      matrix:
        service: [api, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Configurar Buildx nativo amd64
        uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir API
        if: matrix.service == 'api'
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ needs.resolve.outputs.image_base }}-api:${{ needs.resolve.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.commit }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: GIT_COMMIT_SHA=${{ needs.resolve.outputs.commit }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Construir Web
        if: matrix.service == 'web'
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ needs.resolve.outputs.image_base }}-web:${{ needs.resolve.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.commit }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            INTERNAL_API_URL=http://api:3001
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Guardar digest de la imagen construida
        env:
          IMAGE_SERVICE: ${{ matrix.service }}
          IMAGE_DIGEST: ${{ steps.api.outputs.digest || steps.web.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/$IMAGE_SERVICE.digest"
      - name: Conservar digest para el manifiesto
        uses: actions/upload-artifact@v4
        with:
          name: rc-digest-${{ github.run_id }}-${{ matrix.service }}
          path: ${{ runner.temp }}/${{ matrix.service }}.digest
          if-no-files-found: error
          # Mantener el digest del otro job al reintentar solo el que falló.
          overwrite: true
          retention-days: 14

  manifest:
    name: Registrar las dos imágenes de la RC
    needs: [resolve, images]
    # Con manifiesto previo se omite toda la matriz, pero se verifica otra vez antes de desplegar.
    if: always() && needs.resolve.result == 'success' && (needs.images.result == 'success' || (needs.images.result == 'skipped' && needs.resolve.outputs.manifest_exists == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RC_TAG: ${{ needs.resolve.outputs.tag }}
      RC_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Preparar ruta del manifiesto
        run: echo "RC_MANIFEST=$RUNNER_TEMP/rc-manifest.json" >> "$GITHUB_ENV"
      - name: Verificar manifiesto ya publicado
        if: needs.resolve.outputs.manifest_exists == 'true'
        run: |
          gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --pattern rc-manifest.json --dir "$RUNNER_TEMP" --clobber
          node scripts/ci/candidate.mjs verify
      - name: Reunir digests de esta ejecución
        if: needs.resolve.outputs.manifest_exists != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: rc-digest-${{ github.run_id }}-*
          path: ${{ runner.temp }}/rc-digests
          merge-multiple: true
      - name: Registrar manifiesto inmutable en la prerelease
        if: needs.resolve.outputs.manifest_exists != 'true'
        run: |
          API_DIGEST=$(cat "$RUNNER_TEMP/rc-digests/api.digest")
          WEB_DIGEST=$(cat "$RUNNER_TEMP/rc-digests/web.digest")
          export API_DIGEST WEB_DIGEST
          node scripts/ci/candidate.mjs create
          gh release upload "$RC_TAG" "$RC_MANIFEST" --repo "$GITHUB_REPOSITORY"

  test:
    name: Probar ${{ needs.resolve.outputs.tag }} en GitHub
    needs: [resolve, manifest]
    # Las dependencias transitivas omitidas por reutilización no deben omitir las pruebas.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.manifest.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RC_TAG: ${{ needs.resolve.outputs.tag }}
      RC_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Preparar rutas de evidencia
        run: |
          echo "RC_MANIFEST=$RUNNER_TEMP/rc-manifest.json" >> "$GITHUB_ENV"
          echo "RC_VERIFICATION=$RUNNER_TEMP/rc-verification.json" >> "$GITHUB_ENV"
          echo "STAGING_STATE_DIR=$RUNNER_TEMP/rc-test-state" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: '22'
          cache: npm
      - name: Descargar y verificar el manifiesto
        run: gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --pattern rc-manifest.json --dir "$RUNNER_TEMP" --clobber
      - name: Verificar el manifiesto y el commit de la RC
        run: node scripts/ci/candidate.mjs verify
      - name: Preparar herramientas de pruebas
        run: |
          npm ci --no-audit --prefer-offline --loglevel=error
          docker pull mcr.microsoft.com/playwright:v1.62.1-noble
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Arrancar las imágenes RC en un entorno temporal de GitHub
        id: deploy
        run: node scripts/ci/staging.mjs deploy
      - name: Integración HTTP y E2E en GitHub
        env:
          STAGING_TEST_ENV: ${{ runner.temp }}/staging-test.env
        run: |
          set -o pipefail
          node --input-type=module <<'NODE'
          import { chmodSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const state = join(process.env.STAGING_STATE_DIR, 'credentials.json');
          const credentials = JSON.parse(readFileSync(state, 'utf8'));
          const values = {
            CI: 'true',
            PROD_URL: 'http://localhost:3200',
            WEB_BASE_URL: 'http://localhost:3200',
            ADMIN_EMAIL: credentials.adminEmail,
            ADMIN_PASSWORD: credentials.adminPassword,
            EXPECTED_COMMIT: process.env.RC_COMMIT,
            HEADLESS: 'true',
          };
          if (Object.values(values).some((value) => /[\r\n]/.test(value))) {
            throw new Error('Una variable de pruebas contiene saltos de línea.');
          }
          writeFileSync(
            process.env.STAGING_TEST_ENV,
            `${Object.entries(values).map(([key, value]) => `${key}=${value}`).join('\n')}\n`,
            { mode: 0o600 },
          );
          chmodSync(process.env.STAGING_TEST_ENV, 0o600);

          const api = await fetch('http://127.0.0.1:3201/api/public/health');
          const health = await api.json();
          if (!api.ok || health.status !== 'ok' || health.commit !== process.env.RC_COMMIT) {
            throw new Error('Staging no ejecuta el commit exacto de la RC.');
          }
          const web = await fetch('http://127.0.0.1:3200/login');
          if (!web.ok) throw new Error('La Web de staging no está lista.');
          NODE

          docker run --rm --init --ipc=host --network host \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env-file "$STAGING_TEST_ENV" \
            --env HOME=/tmp/playwright-home \
            --env npm_config_cache=/tmp/npm-cache \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            bash -euo pipefail -c 'mkdir -p "$HOME"; npm run test:staging && npm run test:e2e' \
            2>&1 | tee "$RUNNER_TEMP/staging-tests.log"

          node --input-type=module <<'NODE'
          const api = await fetch('http://127.0.0.1:3201/api/public/health');
          const health = await api.json();
          if (!api.ok || health.status !== 'ok' || health.commit !== process.env.RC_COMMIT) {
            throw new Error('La RC dejó de estar lista o cambió el commit durante las pruebas.');
          }
          NODE
      - name: Guardar evidencia de aprobación técnica
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          node scripts/ci/candidate.mjs verified
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          if (process.env.CI_RUNNER_ENVIRONMENT !== 'github-hosted') {
            throw new Error('La aprobación de imágenes requiere un runner hospedado por GitHub.');
          }
          const proof = JSON.parse(readFileSync(process.env.RC_VERIFICATION, 'utf8'));
          proof.runnerEnvironment = 'github-hosted';
          writeFileSync(process.env.RC_VERIFICATION, `${JSON.stringify(proof, null, 2)}\n`);
          NODE
          echo "RC $RC_TAG validada en GitHub. La VM recibirá estos mismos digests después de aprobar las pruebas." >> "$GITHUB_STEP_SUMMARY"
          cat "$RC_MANIFEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar evidencia en la prerelease
        uses: actions/github-script@v7
        env:
          RC_TAG: ${{ needs.resolve.outputs.tag }}
          RC_VERIFICATION: ${{ runner.temp }}/rc-verification.json
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs/promises');
            const { owner, repo } = context.repo;
            const tag = process.env.RC_TAG;
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            if (release.draft || !release.prerelease || release.tag_name !== tag) {
              throw new Error(`La release ${tag} no es una prerelease publicada.`);
            }
            const name = 'rc-verification.json';
            const existing = release.assets.find((asset) => asset.name === name);
            if (existing) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
            }
            const data = await fs.readFile(process.env.RC_VERIFICATION);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name,
              data,
              headers: { 'content-type': 'application/json', 'content-length': data.length },
            });
            core.info(`Publicada ${name} en ${tag}.`);
      - name: Conservar manifiesto y aprobación para la VM
        uses: actions/upload-artifact@v4
        with:
          name: verified-rc-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rc-manifest.json
            ${{ runner.temp }}/rc-verification.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Diagnóstico si falla el entorno temporal
        if: failure() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success'
        run: node scripts/ci/staging.mjs logs
      - name: Conservar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-test-results-${{ needs.resolve.outputs.tag }}
          path: |
            ${{ runner.temp }}/staging-tests.log
            test-results/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Eliminar contenedores y base de datos temporales de GitHub
        if: always() && steps.deploy.outcome != 'skipped' && steps.checkout.outcome == 'success'
        run: |
          if [ -f "$STAGING_STATE_DIR/rc.env" ]; then
            docker compose --project-name paraglide-staging \
              --env-file "$STAGING_STATE_DIR/rc.env" \
              -f docker-compose.staging.yml down --volumes --remove-orphans
          fi

  staging:
    name: Desplegar ${{ needs.resolve.outputs.tag }} aprobada en la VM
    needs: [resolve, test]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.test.result == 'success' }}
    runs-on: [self-hosted, srv-hp-vm]
    timeout-minutes: 15
    environment:
      name: staging
    defaults:
      run:
        working-directory: ${{ github.workspace }}/rc-deploy
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RC_TAG: ${{ needs.resolve.outputs.tag }}
      RC_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: rc-deploy
          persist-credentials: false
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: '22'
      - name: Descargar únicamente el manifiesto aprobado en esta ejecución
        uses: actions/download-artifact@v4
        with:
          name: verified-rc-${{ github.run_id }}
          path: ${{ runner.temp }}/rc-approved
      - name: Verificar aprobación, commit y digests antes de descargar imágenes
        run: |
          echo "RC_MANIFEST=$RUNNER_TEMP/rc-approved/rc-manifest.json" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { validateManifest } from './scripts/ci/candidate.mjs';
          const directory = join(process.env.RUNNER_TEMP, 'rc-approved');
          const expected = {
            tag: process.env.RC_TAG,
            commit: process.env.RC_COMMIT,
            repository: process.env.GITHUB_REPOSITORY,
          };
          const manifest = validateManifest(JSON.parse(readFileSync(join(directory, 'rc-manifest.json'), 'utf8')), expected);
          const proof = validateManifest(JSON.parse(readFileSync(join(directory, 'rc-verification.json'), 'utf8')), expected);
          assert.equal(proof.status, 'passed');
          assert.equal(proof.runnerEnvironment, 'github-hosted');
          assert.equal(proof.workflowRun, `${process.env.GITHUB_SERVER_URL}/${expected.repository}/actions/runs/${process.env.GITHUB_RUN_ID}`);
          assert.deepEqual(proof.images, manifest.images);
          for (const check of ['readiness-and-commit', 'staging-suites-01-07', 'playwright-e2e']) {
            assert.ok(proof.checks?.includes(check), `Falta aprobación de ${check}`);
          }
          NODE
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Descargar imágenes aprobadas y actualizar staging local
        id: deploy
        run: node scripts/ci/staging.mjs deploy
      - name: Registrar despliegue local y comprobación de arranque
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const manifest = JSON.parse(readFileSync(process.env.RC_MANIFEST, 'utf8'));
          const deployment = {
            ...manifest,
            status: 'deployed',
            deployedAt: new Date().toISOString(),
            runnerEnvironment: process.env.CI_RUNNER_ENVIRONMENT,
            workflowRun: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            checks: ['readiness-and-commit'],
          };
          writeFileSync(join(process.env.RUNNER_TEMP, 'staging-deployment.json'), `${JSON.stringify(deployment, null, 2)}\n`);
          NODE
          echo "RC $RC_TAG desplegada en la VM por sus digests aprobados en GitHub. HTTP/E2E no se repiten localmente." >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar evidencia de despliegue en la prerelease
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs/promises');
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: process.env.RC_TAG });
            if (release.draft || !release.prerelease) throw new Error('Se requiere una prerelease publicada.');
            const name = 'staging-deployment.json';
            const existing = release.assets.find((asset) => asset.name === name);
            if (existing) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
            const data = await fs.readFile(`${process.env.RUNNER_TEMP}/${name}`);
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: release.id, name, data,
              headers: { 'content-type': 'application/json', 'content-length': data.length },
            });
      - name: Diagnóstico si falla el despliegue local
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          if [ -f "$RUNNER_TEMP/rc-approved/rc-manifest.json" ]; then
            export RC_MANIFEST="$RUNNER_TEMP/rc-approved/rc-manifest.json"
            node scripts/ci/staging.mjs logs
          fi
