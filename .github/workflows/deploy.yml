name: Deploy to Homelab

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths-ignore:
      - 'docs/**'
      - 'memories/**'
      - '**/*.md'
      - '.agents/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Plataformas Docker (linux/amd64 para lab rápido, linux/amd64,linux/arm64 para prod)'
        required: true
        default: 'linux/amd64'
        type: choice
        options:
          - 'linux/amd64'
          - 'linux/amd64,linux/arm64'
          - 'linux/arm64'

# Evita que dos pushes corran el deploy en paralelo sobre el mismo runner
# self-hosted (comparten contenedores/imágenes y se pisan entre sí).
concurrency:
  group: deploy-homelab
  cancel-in-progress: false

# packages:write permite publicar las imágenes en GHCR desde CI;
# contents:read es lo único que necesita el checkout.
permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'
  BUILD_PLATFORMS: ${{ inputs.platforms || (startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64') }}

jobs:
  lint-web:
    name: Lint Web (ESLint — Bloqueante)
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline --loglevel=error

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Build shared (tipos @parapente/shared para ESLint)
        run: npm run build:shared

      - name: ESLint (web)
        run: npm run lint 2>&1 | tee /tmp/eslint.log; exit ${PIPESTATUS[0]}

      - name: Upload lint logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-web-logs
          path: /tmp/eslint.log
          retention-days: 7

  test-api:
    name: Tests API (Vitest)
    runs-on: ubuntu-latest
    cache-mode: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # loglevel=error silencia deprecation warnings transitivos en CI
        run: npm ci --no-audit --prefer-offline --loglevel=error

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Build shared + Run API tests
        run: |
          npm run build:shared
          npm run test:api

  test-web:
    name: Tests Web (Vitest ${{ matrix.shard }})
    runs-on: ubuntu-latest
    cache-mode: read
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # loglevel=error silencia deprecation warnings transitivos en CI
        run: npm ci --no-audit --prefer-offline --loglevel=error

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Build shared + Run web tests
        run: |
          npm run build:shared
          npm --prefix apps/web test -- --shard=${{ matrix.shard }}

  test-mcp:
    name: Tests MCP Server (Vitest)
    runs-on: ubuntu-latest
    cache-mode: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline --loglevel=error

      - name: Build shared + Run MCP tests
        run: |
          npm run build:shared
          npm run test:mcp

  build-api-image:
    name: Build & Push API Image (GHCR)
    runs-on: ubuntu-latest
    cache-mode: write
    needs: [test-api, test-mcp]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<corto> (inmutable, permite rollback) + latest (puntero móvil).
      # El job `deploy` usa `sha-${GITHUB_SHA:0:7}` para tirar de la imagen exacta.
      - name: Docker metadata (api)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zer0x25/paraglide-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-web-image:
    name: Build & Push Web Image (GHCR)
    runs-on: ubuntu-latest
    cache-mode: write
    needs: [test-web, lint-web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zer0x25/paraglide-web
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          # En producción Next reescribe /api/* al API interno del compose.
          build-args: |
            INTERNAL_API_URL=http://api:3001
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to VM (Self-Hosted)
    runs-on: [self-hosted, srv-hp-vm]
    cache-mode: none
    needs: [test-api, test-web, test-mcp, lint-web, build-api-image, build-web-image]
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images & restart (no build)
        # El servidor ya NO compila: solo baja las imágenes inmutables que CI
        # acaba de publicar (tag sha-<corto>) y recrea los contenedores.
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          cd /home/zer0x/server.lab/repos/paraglide
          git fetch origin main
          git reset --hard origin/main
          export IMAGE_TAG="sha-${GITHUB_SHA:0:7}"
          export API_IMAGE="ghcr.io/zer0x25/paraglide-api:${IMAGE_TAG}"
          export WEB_IMAGE="ghcr.io/zer0x25/paraglide-web:${IMAGE_TAG}"
          export GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}"
          export NEXT_PUBLIC_GOOGLE_CLIENT_ID="${NEXT_PUBLIC_GOOGLE_CLIENT_ID}"
          # Persistir para futuros `docker compose up` manuales sin pasar por Actions
          grep -q "^GOOGLE_CLIENT_ID=" .env 2>/dev/null && sed -i "s/^GOOGLE_CLIENT_ID=.*/GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}/" .env || echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" >> .env
          grep -q "^NEXT_PUBLIC_GOOGLE_CLIENT_ID=" .env 2>/dev/null && sed -i "s/^NEXT_PUBLIC_GOOGLE_CLIENT_ID=.*/NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}/" .env || echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}" >> .env
          docker compose down --remove-orphans || true
          docker compose pull api web
          docker compose up -d --no-build --force-recreate --remove-orphans
          docker image prune -af --filter "until=2h"

      - name: Apply database schema (prisma db push)
        # El deploy reconstruye el codigo pero NO migraba el esquema, dejando la
        # BD de prod desactualizada (columnas version/enums/dinero faltantes -> 500).
        # Sincronizamos el esquema dentro del contenedor api (tiene prisma y el
        # DATABASE_URL interno apuntando a db:5432/parapente_db).
        # SIN --accept-data-loss (deuda técnica 2026-09-30): un cambio de esquema
        # destructivo (drop/rename de columnas) debe revisarse y aplicarse a mano,
        # nunca de forma silenciosa en un deploy desatendido. El baseline limpio de
        # migraciones vive en apps/api/prisma/migrations/ (ver ADR 015).
        run: |
          cd /home/zer0x/server.lab/repos/paraglide
          echo "🔄 Aplicando prisma db push contra la BD de produccion..."
          docker compose exec -T api sh -c "npx prisma db push --schema=apps/api/prisma/schema.prisma --skip-generate" || {
            echo "❌ db push falló. Revisa el drift del esquema antes de continuar (un cambio destructivo requiere revisión manual; ver ADR 015)."
            exit 1
          }
          echo "✅ Esquema de BD sincronizado."

      - name: Seed prod defaults (reglas/tarifas/promoción, idempotente)
        # Instancia nueva queda lista sin intervención manual. Respetar edición admin:
        # seed.prod.ts hace upsert con update:{} / findFirst (no pisa), y respeta
        # soft-delete. Seguro re-ejecutar en cada deploy (volumen persiste).
        run: |
          cd /home/zer0x/server.lab/repos/paraglide
          echo "🌱 Sembrando defaults de producción (si faltan)..."
          docker compose exec -T api sh -c "npx tsx apps/api/prisma/seed.prod.ts" || {
            echo "⚠️ seed prod no aplicado (se puede re-ejecutar manualmente)."
          }

      - name: Apply special indexes (BRIN, pg_trgm, partials)
        # Pilar 4.3: índices que Prisma no puede declarar en schema.prisma
        # (BRIN en vuelos.fechaHora, GIN pg_trgm para búsquedas ILIKE,
        # parcial deletedAt sobre el compuesto caliente). Idempotente.
        run: |
          cd /home/zer0x/server.lab/repos/paraglide
          docker compose exec -T api sh -c "npx tsx apps/api/scripts/indexes-especiales.ts" || {
            echo "⚠️ Índices especiales no aplicados (se puede re-ejecutar el script)."
          }

      - name: Post-Deploy Health Check & Auto-Verification
        run: |
          echo "🩺 Esperando readiness de los servicios (hasta 90s)..."
          # Se comprueba /login (pública) y no / porque el middleware de auth
          # redirige / → /login (307) cuando no hay cookie: es el comportamiento
          # esperado, no un fallo. /login debe responder 200 siempre.
          for i in $(seq 1 30); do
            WEB_OK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100/login 2>/dev/null || echo "000")
            API_OK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3101/api/public/health 2>/dev/null || echo "000")
            if [ "$WEB_OK" = "200" ] && [ "$API_OK" = "200" ]; then
              echo "🟢 Web HTTP $WEB_OK + API HTTP $API_OK listos."
              break
            fi
            echo "⏳ Esperando servicios... (web=$WEB_OK api=$API_OK) [intento $i/30]"
            sleep 3
          done

          for CONTAINER in parapente_web parapente_api parapente_postgres; do
            STATUS=$(docker inspect --format '{{.State.Status}}' "$CONTAINER" 2>/dev/null || echo "not_found")
            if [ "$STATUS" != "running" ]; then
              echo "❌ Error: Container $CONTAINER is not running (Status: $STATUS)"
              docker logs --tail 40 "$CONTAINER" 2>/dev/null || true
              exit 1
            fi
            echo "🟢 Container $CONTAINER is running."
          done

          WEB_OK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100/login 2>/dev/null || echo "000")
          API_OK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3101/api/public/health 2>/dev/null || echo "000")
          if [ "$WEB_OK" != "200" ] || [ "$API_OK" != "200" ]; then
            echo "❌ Health check final falló: web=$WEB_OK api=$API_OK"
            docker logs --tail 40 parapente_api 2>/dev/null || true
            exit 1
          fi

          echo "🎉 All health checks PASSED successfully!"

      - name: Generate Deployment Step Summary
        if: always()
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          HEALTH_JSON=$(curl -s http://localhost:3101/api/public/health 2>/dev/null || echo '{"status":"unreachable"}')
          echo "## 🚀 Despliegue en Homelab" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parámetro | Detalle |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **🌐 URL Producción** | [https://parapente.zer0x.org](https://parapente.zer0x.org) |" >> $GITHUB_STEP_SUMMARY
          echo "| **📦 Commit** | \`$SHORT_SHA\` (\`${{ github.ref_name }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **🐳 Imagen API** | \`ghcr.io/${{ github.repository }}-api:sha-$SHORT_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **🐳 Imagen Web** | \`ghcr.io/${{ github.repository }}-web:sha-$SHORT_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **📡 API Health** | \`$HEALTH_JSON\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **⏱️ Fecha** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup old Docker images (keep <= 2h)
        if: always()
        run: |
          echo "🧹 Limpiando imágenes antiguas (> 2h) sin contenedor activo..."
          docker image prune -af --filter "until=2h"

  cleanup-ghcr:
    name: Prune Old GHCR Images
    runs-on: ubuntu-latest
    cache-mode: none
    needs: [deploy]
    if: success()
    permissions:
      packages: write
    steps:
      - name: Prune old GHCR images (API & Web)
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: 'paraglide-api,paraglide-web'
          keep-n-tagged: 3
          exclude-tags: 'latest'
          delete-untagged: true
          delete-partial-images: true
          token: ${{ secrets.GITHUB_TOKEN }}

